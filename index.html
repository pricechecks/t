<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Buttons - Top 50 Complete</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #ffffff;
            --text-muted: #a0a0a5;
            --search-bg: #26262b;
            --button-shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        #search-bar {
            width: 100%;
            padding: 16px 24px;
            border-radius: 30px;
            border: none;
            background-color: var(--search-bg);
            color: var(--text-color);
            font-size: 1.1rem;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        #search-bar:focus {
            box-shadow: 0 4px 20px rgba(255, 65, 108, 0.5);
            background-color: #2e2e35;
        }

        .soundboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            padding: 10px;
        }

        .sound-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .sound-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .instant-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 0 var(--shadow-color), 0 8px 12px var(--button-shadow);
            transition: all 0.05s ease;
            margin-bottom: 18px;
            outline: none;
        }

        .instant-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 var(--shadow-color), 0 2px 6px var(--button-shadow);
        }

        .sound-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.4;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.8rem;
        }

        .btn-red { background: #ff416c; --shadow-color: #bd1a3c; }
        .btn-blue { background: #00b4db; --shadow-color: #007791; }
        .btn-green { background: #11998e; --shadow-color: #0b665f; }
        .btn-yellow { background: #f1c40f; --shadow-color: #b7950b; }
        .btn-purple { background: #8e44ad; --shadow-color: #623078; }
        .btn-orange { background: #e67e22; --shadow-color: #b35c16; }
    </style>
</head>
